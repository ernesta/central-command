<!doctype html><html><head><meta charset="utf-8"><title>Watch mockup</title><style>
/* Design tokens ("Cool Slate"). Components use these, never raw values, so a
   future theme is a token swap. */
:root {
  /*
   * Light and dark, each colour once: `light-dark(light, dark)` picks by the colour scheme, which follows the theme
   * setting (the main process sets it for the window) and the system when the setting is System.
   */
  color-scheme: light dark;

  /* Colour */
  --bg: light-dark(#edeff2, #14181d);
  --panel: light-dark(#e1e5ea, #1b2128);
  --surface: light-dark(#ffffff, #1f262e);
  --ink: light-dark(#1b222b, #e6eaee);
  --text-secondary: light-dark(#3a4652, #c2cad2);
  --text-muted: light-dark(#5c6672, #98a3af);
  --border-soft: light-dark(#d3d8de, #2f3843);
  --border-strong: light-dark(#c3cad2, #3d4855);
  --border-faint: light-dark(#e6e9ed, #262e37);
  --hover-tint: light-dark(#f4f6f8, #262e37);
  --accent: light-dark(#35577a, #86aad0);
  --accent-hover: light-dark(#2f4d6c, #9bbbdc);
  --accent-contrast: light-dark(#ffffff, #0f1620);
  /* Hours charts: a week under its plan (amber against the accent blue, apart under colour-blind simulation) and a week not over yet. */
  --chart-under: light-dark(#b8741a, #d9a05a);
  --chart-now: light-dark(#9db3c9, #4a6784);
  --selected-bg: light-dark(#dce6ee, #2a3b4d);
  --selected-text: light-dark(#1f3a52, #d3e3f2);
  /* The Markdown characters an editor shows around the block or span the cursor is in (`###`, `**`, `](url)`). */
  --marker: light-dark(#7a8592, #8794a1);
  --danger: light-dark(#a8433f, #dc7c77);
  --danger-hover: light-dark(#953a37, #e79591);
  /* Behind a dialog. */
  --scrim: light-dark(rgba(27, 34, 43, 0.35), rgba(0, 0, 0, 0.6));
  /* Always the opposite of --ink/--bg, so a tooltip reads the same in both themes. */
  --tooltip-bg: light-dark(#1b222b, #e6eaee);
  --tooltip-text: light-dark(#edeff2, #1b222b);
  /* The accent as it reads on the tooltip/toast background (the opposite pair of --accent). */
  --accent-on-tooltip: light-dark(#86aad0, #35577a);
  /* The toast stays dark in both themes (a light pill in dark mode glares): a raised dark surface, with the same accent. */
  --toast-bg: light-dark(#1b222b, #2b343f);
  --toast-text: #edeff2;
  --accent-on-toast: #86aad0;

  }
:root{--font-body:'IBM Plex Sans',system-ui,sans-serif;--font-mono:ui-monospace,monospace;--text-11:11px;--text-12:12px;--text-13:13px;--text-14:14px;--radius-control:8px;--radius-card:12px;--radius-pill:999px;--shadow-float:0 8px 24px var(--shadow-color);--transition-fast:120ms ease}
html[data-theme=light]{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:36px 0 4px}h3{font-size:13px;margin:22px 0 6px}
p.n{margin:0 0 8px;color:var(--text-muted);font-size:13px;max-width:900px}
button.t{position:fixed;top:16px;right:16px;padding:6px 12px;border-radius:8px;border:1px solid var(--border-soft);background:var(--surface);color:var(--ink);cursor:pointer}
.wrap{max-width:1100px}
table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card);overflow:hidden}
th{padding:12px 16px;border-bottom:1px solid var(--border-soft);color:var(--text-muted);font-size:11px;font-weight:500;letter-spacing:.06em;text-align:left;text-transform:uppercase;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border-faint);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;height:20px}
tr:last-child td{border-bottom:0}tr:hover td{background:var(--hover-tint)}
.ink{color:var(--ink);font-weight:500}
.ic{display:inline-flex;gap:4px;color:var(--text-muted);vertical-align:-2px}
.ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.75}
.slot{display:inline-block;width:34px;color:var(--text-muted);vertical-align:-2px}
.slot .ic{gap:4px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--panel);color:var(--text-secondary);font-size:12px;line-height:1.4;vertical-align:middle;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.init{padding:2px 9px;border-radius:999px;background:var(--panel);color:var(--text-secondary);font-family:var(--font-mono);font-size:13px;margin-right:6px}
.more{color:var(--text-muted);font-size:12px;margin-left:2px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--selected-bg);color:var(--selected-text);font-size:12px;font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.acc{color:var(--accent)}
.bar td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.hv{opacity:0;transition:opacity .12s}tr:hover .hv{opacity:1}
.grp td{background:var(--panel);color:var(--text-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 16px;height:auto}
.tipbox{position:fixed;z-index:9;pointer-events:none;padding:4px 8px;border-radius:8px;background:var(--tooltip-bg);color:var(--tooltip-text);font-size:12px;box-shadow:var(--shadow-float);opacity:0;transition:opacity .12s;max-width:420px;white-space:normal}
</style><style>
body{padding:0}
.page{display:grid;gap:28px;align-content:start;padding:36px 48px 48px;max-width:1240px}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px 24px}
.header h1{margin:0;font-size:32px}.actions{display:flex;align-items:center;gap:12px}
.allLink{padding:8px 16px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:500}
.btn{padding:8px 16px;border-radius:8px;background:var(--accent);color:var(--accent-contrast);font-size:14px;font-weight:500}
.section{display:grid;gap:12px}.sectionHead{display:flex;align-items:center;justify-content:space-between;padding:4px}
.label{margin:0;color:var(--text-muted);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.windowNote{color:var(--text-muted);font-size:13px;margin-right:16px}.link{color:var(--accent);font-size:13px}
.box{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;margin:0;padding:0;list-style:none}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:4px}
.card{display:grid;gap:4px;padding:16px 20px;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px}
.card:hover{background:var(--hover-tint)}.card h3{margin:0;font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{margin:0;color:var(--text-muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.line b{color:var(--accent);font-weight:500}
.recent{display:grid;grid-template-columns:120px minmax(0,1fr) 240px 130px 56px;align-items:center;gap:8px 20px;padding:12px 20px;border-bottom:1px solid var(--border-faint);font-size:14px}
li:last-child .recent{border-bottom:0}.recent:hover{background:var(--hover-tint)}
.recent .t2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:var(--text-muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.new{margin-left:10px;padding:1px 8px;border-radius:999px;background:var(--selected-bg);color:var(--selected-text);font-size:12px;font-weight:500}
.ib{display:inline-flex;gap:10px;color:var(--text-muted);justify-content:flex-end}.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75}
.ib .on{color:var(--accent)}.ib .on svg{fill:currentColor}
.n2{margin:0 0 0;padding:0 4px;color:var(--text-muted);font-size:13px;max-width:900px}
.cap{padding:24px 48px 0;max-width:1100px;color:var(--text-muted);font-size:13px}
</style></head><body><button class="t" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'">Light / dark</button>
<div class="cap"><b>Watch, mockup 3.</b> Same shape as the Training landing (<code>LandingHeader</code>, <code>LandingSection</code>, the recent list, "See all →"); trainings and conferences are separate sections. No chips, keywords or monthly reminder.</div>
<div class="page" id="p"></div><div class="tipbox" id="tip"></div>
<script>
const B='<svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
const X='<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const icons=(saved)=>'<span class="ib"><span class="'+(saved?'on':'')+'" data-tip="'+(saved?'Saved':'Save')+'">'+B+'</span><span data-tip="Dismiss">'+X+'</span></span>';
const row=(d,t,src,note,isNew,saved)=>'<li><div class="recent"><span>'+d+'</span><span class="t2" data-tip="'+t+'">'+t+(isNew?'<span class="new">New</span>':'')+'</span><span class="note">'+src+'</span><span class="note">'+note+'</span>'+icons(saved)+'</div></li>';
const card=(t,l)=>'<div class="card"><h3>'+t+'</h3><p class="line">'+l+'</p></div>';
function sec(title,all,cards,rows,more){return '<section class="section"><div class="sectionHead"><h2 class="label">'+title+'</h2><span><span class="windowNote">'+more+'</span><span class="link">'+all+' →</span></span></div>'+'<ul class="box">'+rows+'</ul></section>'}
document.getElementById('p').innerHTML=
'<header class="header"><h1>Watch</h1><div class="actions"><span class="allLink">Sources</span><span class="btn">Check now</span></div></header>'+
sec('Saved','See all saved','',
 row('Apply by 5 Nov','Telling the Truth? Authorship, audiences and authenticity','LINGUIST List: conferences','Conference',0,1)+
 row('Apply by 12 Dec','Quantitative text analysis with R: new dates in March','ukdataservice.ac.uk · training events','Training',0,1),'Their deadlines show in Home’s Coming up')+
sec('Trainings','See all trainings',
 '',
 row('Yesterday','Summer school: mixed models for linguistics','LINGUIST List: summer schools','—',1,0)+
 row('Yesterday','Quantitative text analysis with R: new dates in March, a long title that cannot fit','ukdataservice.ac.uk · training events','Apply by 12 Dec',1,1)+
 row('2 days ago','MY580 Methods Short Courses: new date added','lse.ac.uk · MY580','Page changed',1,0)+
 row('9 Oct','Introduction to R for social scientists','natcen.ac.uk · events','Apply by 30 Oct',0,0),'11 sources')+
sec('Conferences','See all conferences',
 '',
 row('Today','Workshop at SLE 2027: To P(reposition) or Not to P(reposition)','LINGUIST List: conferences','Apply by 10 Nov',1,0)+
 row('Today','Telling the Truth? Authorship, audiences and authenticity','LINGUIST List: conferences','Apply by 5 Nov',1,1)+
 row('3 days ago','Future meetings: new 2027 dates','eps.ac.uk · future meetings','Page changed',1,0),'5 sources');
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.textContent=t.dataset.tip;const b=t.getBoundingClientRect();tip.style.opacity=1;tip.style.left=Math.max(8,b.left)+'px';tip.style.top=(b.top-30)+'px'});
</script></body></html>
